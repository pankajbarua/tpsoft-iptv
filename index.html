<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="tpsoft-iptv.jpeg" type="image/x-icon" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TPSoft IPTV - Premium Auto-Save</title>
<!-- HLS.js for streaming -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<!-- Font Awesome 6 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
  * {
    box-sizing: border-box;
    user-select: none;
  }

  body {
    margin: 0;
    background: #000;
    font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    overflow: hidden;
    color: white;
  }

  /* ========= LEFT PANEL ========= */
  #leftPanel {
    position: fixed;
    left: 0;
    top: 0;
    width: 280px;
    height: 100vh;
    background: rgba(10, 10, 12, 0.95);
    backdrop-filter: blur(12px);
    padding: 18px 14px;
    overflow-y: auto;
    z-index: 1000;
    border-right: 1px solid rgba(255, 255, 255, 0.1);
    transform: translateX(-100%);
    transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    box-shadow: 2px 0 20px rgba(0,0,0,0.6);
  }

  #leftPanel.open {
    transform: translateX(0);
  }

  #leftPanel::-webkit-scrollbar { width: 4px; }
  #leftPanel::-webkit-scrollbar-track { background: #1e1e1e; }
  #leftPanel::-webkit-scrollbar-thumb { background: #ff6600; border-radius: 8px; }

  #leftPanel h3 {
    margin: 18px 0 8px 0;
    font-size: 14px;
    color: #ffaa66;
    letter-spacing: 1px;
    border-left: 3px solid #ff6600;
    padding-left: 10px;
  }

  input, select, button {
    width: 100%;
    padding: 12px 12px;
    margin: 6px 0;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    transition: all 0.2s;
  }

  input, select {
    background: #1f1f2a;
    color: #f0f0f0;
    border: 1px solid #2c2c38;
  }

  input:focus {
    outline: none;
    border-color: #ff6600;
    background: #2a2a35;
  }

  button {
    background: linear-gradient(95deg, #ff4d00, #ff7a2f);
    color: white;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(255, 77, 0, 0.3);
  }

  button:active { transform: scale(0.97); }

  .signature {
    margin-top: 28px;
    font-size: 12px;
    text-align: center;
    background: rgba(0,0,0,0.5);
    border-radius: 16px;
    padding: 12px;
    line-height: 1.5;
  }
  .signature .dev-name {
    color: #ff4d00;
    font-weight: bold;
  }
  .signature .company {
    color: #ffcc66;
  }

  /* ========= PLAYER ========= */
  #playerContainer {
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: #000;
    z-index: 1;
  }

  video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: black;
  }

  /* ========= CONTROLS WRAPPER (for fullscreen) ========= */
  .controls-wrapper {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 100;
  }
  
  /* ========= TOP BAR & TABS ========= */
  .top-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 56px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.75), transparent);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px 0 20px;
    pointer-events: auto;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  #menuToggleBtn, #channelBtn {
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    border: none;
    border-radius: 40px;
    color: white;
    cursor: pointer;
  }
  #menuToggleBtn { width: 40px; height: 40px; font-size: 18px; display: flex; align-items: center; justify-content: center; }
  #channelBtn { padding: 6px 14px; font-weight: bold; font-size: 13px; border: 1px solid rgba(255,255,255,0.2); }
  #channelBtn i { margin-right: 6px; }

  #countryTabs {
    position: absolute;
    top: 68px;
    left: 20px;
    right: 20px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    white-space: nowrap;
    padding-bottom: 8px;
    scrollbar-width: thin;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: auto;
  }

  #countryTabs button {
    width: auto;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(8px);
    padding: 6px 16px;
    border-radius: 40px;
    font-size: 12px;
    font-weight: 500;
    color: #eee;
    border: 1px solid rgba(255,255,255,0.2);
    flex-shrink: 0;
  }

  #countryTabs button.active-tab {
    background: #ff6600;
    color: black;
    border-color: #ffaa66;
  }

  /* ========= OVERLAY CHANNEL LIST ========= */
  #overlay {
    position: fixed;
    top: 0;
    right: 0;
    width: 380px;
    max-width: 88vw;
    height: 100vh;
    background: rgba(12, 12, 18, 0.94);
    backdrop-filter: blur(16px);
    display: none;
    flex-direction: column;
    z-index: 10000;
    border-left: 1px solid rgba(255,255,255,0.15);
  }

  #overlay.show { display: flex; }

  .overlay-header {
    padding: 20px 16px 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #2c2c38;
  }

  #closeOverlay { background: none; width: auto; font-size: 24px; box-shadow: none; }
  #searchBox {
    margin: 12px 16px;
    width: calc(100% - 32px);
    background: #1e1e2a;
    border-radius: 40px;
  }

  #popup {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px;
  }

  .channel {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 14px;
    margin-bottom: 8px;
    border-radius: 16px;
    background: rgba(255,255,255,0.06);
    cursor: pointer;
    transition: 0.2s;
  }

  .channel:hover { background: rgba(255, 102, 0, 0.3); }
  .channel.active { background: #ff6600; color: #111; }
  .channel img { width: 45px; height: 45px; border-radius: 10px; object-fit: cover; background: #2a2a2a; }
  .channel div { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ========= BOTTOM CONTROLS ========= */
  #bottomControls {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(20px);
    padding: 8px 20px;
    border-radius: 60px;
    border: 1px solid rgba(255,255,255,0.2);
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: auto;
  }
  
  #bottomControls.visible {
    opacity: 1;
  }

  .ctrlBtn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(20,20,30,0.9);
    color: white;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: none;
    transition: 0.1s linear;
  }
  
  .ctrlBtn:active { background: #ff6600; transform: scale(0.94); }

  .vol-slider { 
    display: flex; 
    align-items: center; 
    gap: 6px; 
    background: rgba(0,0,0,0.5); 
    padding: 4px 10px; 
    border-radius: 40px; 
  }
  #volumeRange { 
    width: 70px; 
    margin: 0; 
    padding: 0;
    height: 3px;
    -webkit-appearance: none;
    background: #ff6600;
    border-radius: 3px;
  }
  #volumeRange::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: white;
    cursor: pointer;
  }
  
  .toast-msg {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: #1f1f2fcc;
    backdrop-filter: blur(16px);
    padding: 6px 16px;
    border-radius: 40px;
    font-size: 12px;
    z-index: 10000;
    pointer-events: none;
    transition: 0.2s;
    color: #ffcc99;
    white-space: nowrap;
  }
  
  /* Controls visible class */
  .controls-visible .top-bar,
  .controls-visible #countryTabs,
  .controls-visible #bottomControls {
    opacity: 1 !important;
  }
  
  /* Fullscreen specific styles */
  .fullscreen-mode .top-bar,
  .fullscreen-mode #countryTabs,
  .fullscreen-mode #bottomControls {
    opacity: 1 !important;
  }
  
  @media (max-width: 760px) { 
    .ctrlBtn { width: 38px; height: 38px; font-size: 16px; }
    #bottomControls { gap: 10px; padding: 6px 16px; }
    #volumeRange { width: 60px; }
  }
</style>
</head>
<body>

<!-- LEFT DRAWER -->
<div id="leftPanel">
  <div style="display: flex; justify-content: space-between; align-items: center;">
<image width=50 height=50 src="tpsoft-iptv.jpeg"><br>
    <h2 style="color:#ff6600; margin:0;"><i class="fas fa-savex"></i> TPSoft IPTV</h2>
    <button id="closeDrawerBtn" style="width:40px; background:none; box-shadow:none; font-size:22px;"><i class="fas fa-times"></i></button>
  </div>
  
  <h3><i class="fas fa-link"></i> M3U / M3U8 URL</h3>
  <input id="m3uUrl" placeholder="Playlist URL" list="playlistSuggestions">
  <datalist id="playlistSuggestions">
    <option value="https://iptv-org.github.io/iptv/countries/bd.m3u">Bangladesh IPTV</option>
    <option value="https://iptv-org.github.io/iptv/countries/in.m3u">India IPTV</option>
    <option value="https://iptv-org.github.io/iptv/categories/news.m3u">News Channels</option>
    <option value="https://iptv-org.github.io/iptv/categories/sports.m3u">Sports Channels</option>
  </datalist>
  <button onclick="loadM3UUrl()"><i class="fas fa-play-circle"></i> Load & Save</button>

  <h3><i class="fas fa-upload"></i> M3U File</h3>
  <input type="file" id="fileInput" accept=".m3u,.m3u8">

  <h3><i class="fas fa-cloud"></i> Xtream Codes</h3>
  <input id="xt_server" placeholder="Server URL (http://domain:port)">
  <input id="xt_user" placeholder="Username">
  <input id="xt_pass" placeholder="Password">
  <button onclick="xtreamLogin()"><i class="fas fa-sign-in-alt"></i> Xtream Login</button>

  <h3><i class="fas fa-server"></i> Server M3U (M3U Plus)</h3>
  <input id="srv_url" placeholder="Server base URL">
  <input id="srv_user" placeholder="Username">
  <input id="srv_pass" placeholder="Password">
  <button onclick="serverM3U()"><i class="fas fa-database"></i> Load & Save</button>

  <div class="signature">
    <div><span style="color: #00cc66;">Developed by-</span></div>
    <div class="dev-name">PANKAJ BARUA</div>
    <div class="company">TP Soft, Chattogram</div>
    <div style="margin-top: 6px; font-size: 10px; color: #aaa;"><i class="fas fa-save"></i> Auto-save active | Preserved after refresh</div>
  </div>
</div>

<div class="controls-wrapper">
  <div class="top-bar" id="topBar">
    <button id="menuToggleBtn"><i class="fas fa-bars"></i></button>
    <div id="channelBtn"><i class="fas fa-list"></i> Channels</div>
  </div>
  <div id="countryTabs"></div>
  <div id="bottomControls">
    <button class="ctrlBtn" onclick="prevChannel()"><i class="fas fa-step-backward"></i></button>
    <button class="ctrlBtn" onclick="togglePlay()"><i class="fas fa-play" id="playPauseIcon"></i></button>
    <button class="ctrlBtn" onclick="nextChannel()"><i class="fas fa-step-forward"></i></button>
    <div class="vol-slider"><i class="fas fa-volume-up"></i><input type="range" id="volumeRange" min="0" max="100" value="70"></div>
  </div>
</div>

<div id="playerContainer">
  <video id="video" controls autoplay playsinline></video>
</div>

<div id="overlay">
  <div class="overlay-header"><h3><i class="fas fa-list"></i> Channel List</h3><button id="closeOverlay" style="background:none;"><i class="fas fa-times"></i></button></div>
  <input id="searchBox" placeholder="🔍 Search channels..." onkeyup="searchChannel()">
  <div id="popup"></div>
</div>
<div id="toastMsg" class="toast-msg">✅ Loading saved data...</div>

<script>
  // DOM elements
  const video = document.getElementById("video");
  const popupDiv = document.getElementById("popup");
  const overlayDiv = document.getElementById("overlay");
  const tabsDiv = document.getElementById("countryTabs");
  const leftPanel = document.getElementById("leftPanel");
  const menuToggle = document.getElementById("menuToggleBtn");
  const closeDrawer = document.getElementById("closeDrawerBtn");
  const channelBtnHeader = document.getElementById("channelBtn");
  const closeOverlayBtn = document.getElementById("closeOverlay");
  const volumeSlider = document.getElementById("volumeRange");
  const playPauseIcon = document.getElementById("playPauseIcon");
  const bottomControls = document.getElementById("bottomControls");
  const topBar = document.getElementById("topBar");
  const controlsWrapper = document.querySelector(".controls-wrapper");
  
  // Auto-hide timer
  let hideTimer = null;
  
  function showControls() {
    if(controlsWrapper) {
      controlsWrapper.classList.add("controls-visible");
    }
    if(topBar) topBar.style.opacity = "1";
    if(tabsDiv) tabsDiv.style.opacity = "1";
    if(bottomControls) bottomControls.classList.add("visible");
    
    if(hideTimer) clearTimeout(hideTimer);
    
    hideTimer = setTimeout(() => {
      // Don't auto-hide in fullscreen mode
      if(!document.fullscreenElement && !document.webkitFullscreenElement) {
        if(topBar) topBar.style.opacity = "0";
        if(tabsDiv) tabsDiv.style.opacity = "0";
        if(bottomControls) bottomControls.classList.remove("visible");
        if(controlsWrapper) controlsWrapper.classList.remove("controls-visible");
      }
    }, 3000);
  }
  
  function onUserActivity() {
    showControls();
  }
  
  // Fullscreen detection
  function handleFullscreenChange() {
    const isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);
    if(isFullscreen) {
      // In fullscreen mode, always show controls
      if(topBar) topBar.style.opacity = "1";
      if(tabsDiv) tabsDiv.style.opacity = "1";
      if(bottomControls) bottomControls.classList.add("visible");
      if(controlsWrapper) controlsWrapper.classList.add("controls-visible");
    } else {
      // Exit fullscreen - reset to normal behavior
      if(hideTimer) clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        if(topBar) topBar.style.opacity = "0";
        if(tabsDiv) tabsDiv.style.opacity = "0";
        if(bottomControls) bottomControls.classList.remove("visible");
        if(controlsWrapper) controlsWrapper.classList.remove("controls-visible");
      }, 3000);
    }
  }
  
  document.addEventListener("fullscreenchange", handleFullscreenChange);
  document.addEventListener("webkitfullscreenchange", handleFullscreenChange);
  
  // Activity listeners
  document.addEventListener("mousemove", onUserActivity);
  document.addEventListener("click", onUserActivity);
  document.addEventListener("keydown", onUserActivity);
  video.addEventListener("click", onUserActivity);
  document.addEventListener("touchstart", onUserActivity);
  video.addEventListener("play", onUserActivity);
  video.addEventListener("pause", onUserActivity);
  
  // Also listen for fullscreen button click on video
  video.addEventListener("webkitbeginfullscreen", () => {
    setTimeout(() => {
      if(topBar) topBar.style.opacity = "1";
      if(tabsDiv) tabsDiv.style.opacity = "1";
      if(bottomControls) bottomControls.classList.add("visible");
    }, 100);
  });
  
  setTimeout(showControls, 500);
  
  let hls = null;
  let filteredChannels = [];
  let currentIndex = 0;
  let groupsMap = {};
  let currentGroup = "All";
  let activeTabBtn = null;

  const STORAGE_KEY = "tpsoft_iptv_data";
  
  function showToast(msg, duration=2000) {
    const toast = document.getElementById("toastMsg");
    toast.innerText = msg;
    toast.style.opacity = "1";
    setTimeout(() => toast.style.opacity = "0", duration);
  }

  function saveToLocalStorage() {
    try {
      const saveData = { groupsMap, lastGroup: currentGroup, lastChannelIndex: currentIndex, timestamp: Date.now() };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(saveData));
    } catch(e) {}
  }

  function loadFromLocalStorage() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    try {
      const data = JSON.parse(raw);
      if(data.groupsMap && Object.keys(data.groupsMap).length > 0) {
        groupsMap = data.groupsMap;
        currentGroup = data.lastGroup || Object.keys(groupsMap)[0];
        currentIndex = data.lastChannelIndex || 0;
        updateGroupTabsFromSaved();
        if(groupsMap[currentGroup]) filteredChannels = groupsMap[currentGroup];
        else filteredChannels = groupsMap[Object.keys(groupsMap)[0]];
        renderChannelList();
        if(filteredChannels.length && currentIndex < filteredChannels.length) playChannel(currentIndex);
        else if(filteredChannels.length) playChannel(0);
        showToast(`📀 Loaded ${filteredChannels.length} saved channels`, 2500);
        return true;
      }
    } catch(e) {}
    return false;
  }

  function updateGroupTabsFromSaved() {
    tabsDiv.innerHTML = "";
    const groups = Object.keys(groupsMap);
    if(groups.length===0) return;
    groups.forEach(grp => {
      const btn = document.createElement("button");
      btn.innerText = grp.length>22 ? grp.substr(0,20)+".." : grp;
      btn.onclick = () => {
        if(activeTabBtn) activeTabBtn.classList.remove("active-tab");
        btn.classList.add("active-tab");
        activeTabBtn = btn;
        currentGroup = grp;
        filteredChannels = groupsMap[grp] || [];
        if(filteredChannels.length) { currentIndex = 0; playChannel(0); }
        renderChannelList();
        document.getElementById("searchBox").value = "";
        saveToLocalStorage();
        onUserActivity();
      };
      tabsDiv.appendChild(btn);
    });
    for(let i=0; i<tabsDiv.children.length; i++) {
      if(tabsDiv.children[i].innerText === currentGroup || (i===0 && !activeTabBtn)) {
        tabsDiv.children[i].click();
        break;
      }
    }
  }

  function updateGroupTabs() {
    tabsDiv.innerHTML = "";
    const groups = Object.keys(groupsMap);
    if(groups.length === 0) return;
    groups.forEach(grp => {
      const btn = document.createElement("button");
      btn.innerText = grp.length>22 ? grp.substr(0,20)+".." : grp;
      btn.onclick = () => {
        if(activeTabBtn) activeTabBtn.classList.remove("active-tab");
        btn.classList.add("active-tab");
        activeTabBtn = btn;
        currentGroup = grp;
        filteredChannels = groupsMap[grp] || [];
        if(filteredChannels.length) { currentIndex = 0; playChannel(0); }
        renderChannelList();
        document.getElementById("searchBox").value = "";
        saveToLocalStorage();
        onUserActivity();
      };
      tabsDiv.appendChild(btn);
    });
    if(tabsDiv.firstChild) { tabsDiv.firstChild.click(); activeTabBtn = tabsDiv.firstChild; }
    saveToLocalStorage();
  }

  function renderChannelList() {
    popupDiv.innerHTML = "";
    if(!filteredChannels.length) { popupDiv.innerHTML = "<div style='padding:20px'>No channels found</div>"; return; }
    filteredChannels.forEach((c, idx) => {
      const div = document.createElement("div");
      div.className = "channel" + (idx === currentIndex ? " active" : "");
      const logoUrl = (c.logo && c.logo.startsWith("http")) ? c.logo : "https://via.placeholder.com/48?text=TV";
      div.innerHTML = `<img src="${logoUrl}" onerror="this.src='https://via.placeholder.com/48?text=TP'"><div style="flex:1;">${escapeHtml(c.name)}</div>`;
      div.onclick = () => { playChannel(idx); closeMenu(); onUserActivity(); };
      popupDiv.appendChild(div);
    });
  }

  function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]; }); }

  function playChannel(index) {
    if(!filteredChannels.length) return;
    if(index<0) index=0;
    if(index>=filteredChannels.length) index=filteredChannels.length-1;
    currentIndex = index;
    const ch = filteredChannels[currentIndex];
    if(!ch || !ch.url) return;
    if(hls) hls.destroy();
    if(Hls.isSupported() && (ch.url.includes('.m3u8') || ch.url.includes('m3u8'))) {
      hls = new Hls({ enableWorker: true });
      hls.loadSource(ch.url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(e=>{}));
    } else {
      video.src = ch.url;
      video.play().catch(e=>showToast("Playback error", 1200));
    }
    renderChannelList();
    document.title = `${ch.name} - TPSoft IPTV`;
    showToast(`📺 ${ch.name}`, 1200);
    saveToLocalStorage();
    onUserActivity();
  }

  function parseM3U(content, sourceName = "Playlist") {
    const lines = content.split(/\r?\n/);
    let channelsArray = [];
    let currentExtInf = null;
    for(let i=0; i<lines.length; i++) {
      let line = lines[i].trim();
      if(line.startsWith("#EXTINF")) {
        let name = "", logo = "", group = "General";
        const logoMatch = line.match(/tvg-logo="([^"]*)"/i);
        if(logoMatch) logo = logoMatch[1];
        const groupMatch = line.match(/group-title="([^"]*)"/i);
        if(groupMatch) group = groupMatch[1];
        let parts = line.split(",");
        if(parts.length>1) name = parts.slice(1).join(",").trim();
        if(!name) name = "Channel";
        currentExtInf = { name, logo, group };
      }
      else if(line.startsWith("http") && currentExtInf) {
        channelsArray.push({ name: currentExtInf.name, url: line, logo: currentExtInf.logo || "", group: currentExtInf.group || "Uncategorized" });
        currentExtInf = null;
      }
    }
    if(channelsArray.length === 0) { showToast("No channels found", 2000); return; }
    const newGroups = {};
    channelsArray.forEach(ch => { let g = ch.group || "Default"; if(!newGroups[g]) newGroups[g] = []; newGroups[g].push(ch); });
    groupsMap = newGroups;
    if(!groupsMap["All"]) groupsMap["All"] = channelsArray;
    updateGroupTabs();
    filteredChannels = groupsMap[Object.keys(groupsMap)[0]];
    currentIndex = 0;
    playChannel(0);
    renderChannelList();
    showToast(`✅ ${channelsArray.length} channels saved`, 2500);
    saveToLocalStorage();
  }

  async function loadM3UUrl() {
    const url = document.getElementById("m3uUrl").value.trim();
    if(!url) { showToast("Enter playlist URL", 1500); return; }
    try {
      showToast("Fetching...");
      const res = await fetch(url);
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      parseM3U(text, url);
    } catch(e) { showToast("Failed to load: "+e.message, 2000); }
  }

  document.getElementById("fileInput").onchange = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => parseM3U(ev.target.result, file.name);
    reader.readAsText(file);
  };

  async function xtreamLogin() {
    let server = document.getElementById("xt_server").value.trim();
    let user = document.getElementById("xt_user").value.trim();
    let pass = document.getElementById("xt_pass").value.trim();
    if(!server || !user || !pass) { showToast("Server, username & password required", 1500); return; }
    if(!server.startsWith("http")) server = "http://"+server;
    try {
      const apiUrl = `${server}/player_api.php?username=${user}&password=${pass}&action=get_live_streams`;
      const response = await fetch(apiUrl);
      const data = await response.json();
      if(!Array.isArray(data) || data.length===0) throw new Error("No streams found");
      const channelsList = data.map(stream => ({ name: stream.name || "Channel", url: `${server}/live/${user}/${pass}/${stream.stream_id}.m3u8`, logo: stream.stream_icon || "", group: stream.category_name || "Xtream Live" }));
      const grpMap = {};
      channelsList.forEach(ch => { let g = ch.group; if(!grpMap[g]) grpMap[g] = []; grpMap[g].push(ch); });
      groupsMap = grpMap;
      if(!groupsMap["All"]) groupsMap["All"] = channelsList;
      updateGroupTabs();
      filteredChannels = groupsMap[Object.keys(groupsMap)[0]];
      currentIndex = 0;
      playChannel(0);
      renderChannelList();
      showToast(`Xtream: ${channelsList.length} channels saved`, 2000);
      saveToLocalStorage();
    } catch(err) { showToast("Xtream error: "+err.message, 2000); }
  }

  async function serverM3U() {
    let srv = document.getElementById("srv_url").value.trim();
    let user = document.getElementById("srv_user").value.trim();
    let pass = document.getElementById("srv_pass").value.trim();
    if(!srv || !user || !pass) { showToast("Server URL, username & password required", 1500); return; }
    if(!srv.startsWith("http")) srv = "http://"+srv;
    const url = `${srv}/get.php?username=${user}&password=${pass}&type=m3u_plus&output=m3u8`;
    try {
      const res = await fetch(url);
      if(!res.ok) throw new Error("Server authentication failed");
      const text = await res.text();
      parseM3U(text, "Server M3U");
    } catch(e) { showToast("Server load failed: "+e.message, 2000); }
  }

  window.nextChannel = () => { if(filteredChannels.length) { playChannel((currentIndex+1)%filteredChannels.length); onUserActivity(); } };
  window.prevChannel = () => { if(filteredChannels.length) { playChannel((currentIndex-1+filteredChannels.length)%filteredChannels.length); onUserActivity(); } };
  window.togglePlay = () => { video.paused ? video.play().catch(e=>{}) : video.pause(); onUserActivity(); };
  window.searchChannel = () => {
    const q = document.getElementById("searchBox").value.toLowerCase();
    if(!q.trim()) filteredChannels = groupsMap[currentGroup] || [];
    else filteredChannels = (groupsMap[currentGroup] || []).filter(c => c.name.toLowerCase().includes(q));
    renderChannelList();
    onUserActivity();
  };
  
  function openMenu() { leftPanel.classList.add("open"); onUserActivity(); }
  function closeMenuDrawer() { leftPanel.classList.remove("open"); onUserActivity(); }
  window.toggleMenu = function() { overlayDiv.classList.toggle("show"); if(overlayDiv.classList.contains("show")) renderChannelList(); onUserActivity(); };
  function closeMenu() { overlayDiv.classList.remove("show"); onUserActivity(); }
  
  menuToggle.onclick = () => { if(leftPanel.classList.contains("open")) closeMenuDrawer(); else openMenu(); onUserActivity(); };
  closeDrawer.onclick = closeMenuDrawer;
  channelBtnHeader.onclick = () => { toggleMenu(); onUserActivity(); };
  closeOverlayBtn.onclick = closeMenu;
  volumeSlider.addEventListener("input", () => { video.volume = volumeSlider.value/100; onUserActivity(); });
  video.volume = 0.7; volumeSlider.value=70;
  video.addEventListener("play", () => playPauseIcon.className = "fas fa-pause");
  video.addEventListener("pause", () => playPauseIcon.className = "fas fa-play");

  document.addEventListener("keydown", (e) => {
    onUserActivity();
    if(e.key === "ArrowRight") { nextChannel(); e.preventDefault(); }
    if(e.key === "ArrowLeft") { prevChannel(); e.preventDefault(); }
    if(e.key === "ArrowUp") { openMenu(); e.preventDefault(); }
    if(e.key === "Escape") { closeMenu(); closeMenuDrawer(); }
    if(e.key === "Enter" && overlayDiv.classList.contains("show")) { if(filteredChannels[currentIndex]) playChannel(currentIndex); closeMenu(); }
    if(e.key === " " || e.key === "Space") { togglePlay(); e.preventDefault(); }
  });

  const loaded = loadFromLocalStorage();
  if(!loaded) {
    showToast("Welcome! Load M3U URL or file (auto-save enabled)", 3000);
  }
</script>
</body>
</html>
